name: Build and deploy Matrix City
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matrixcity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WASM compiler
        run: sudo apt-get update -qq && sudo apt-get install -y clang-18 lld-18
      - run: npm run check:public
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: matrixcity-static
          path: dist/
      - name: Check Azure deployment configuration
        id: azure
        env:
          DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -n "$DEPLOY_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Build verified. Add AZURE_STATIC_WEB_APPS_API_TOKEN to enable Azure publication."
          fi
      - name: Deploy production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.azure.outputs.configured == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
