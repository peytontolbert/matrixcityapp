name: Build and deploy Matrix City
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matrixcity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WASM compiler
        run: sudo apt-get update -qq && sudo apt-get install -y clang-18 lld-18
      - run: npm run check:public
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: matrixcity-static
          path: dist/
      - name: Verify Azure deployment credential
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_STONE_0D3C53A0F }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::The Azure deployment secret is missing."
            exit 1
          fi
      - name: Deploy production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_STONE_0D3C53A0F }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
