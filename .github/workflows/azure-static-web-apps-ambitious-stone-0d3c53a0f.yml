name: Build and deploy Matrix City
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: matrixcity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: matrixgames_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ephemeral-ci-fixture@127.0.0.1:5432/matrixgames_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WASM compiler
        run: sudo apt-get update -qq && sudo apt-get install -y clang-18 lld-18
      - run: npm ci --ignore-scripts
      - run: node --test driving/tests/*.test.mjs
      - run: npm ci --prefix api --ignore-scripts
      - run: npm test --prefix api
      - run: npm ci --prefix games --ignore-scripts
      - run: npm test --prefix games
      - run: npm run check:public
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: matrixgames-driving-storage
          path: |
            driving/leaderboard.mjs
            driving/tools/init-leaderboard.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: matrixcity-static
          path: dist/
  native-launcher:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: peytontolbert/matrixgameslauncher
          ref: e46fc7bd541c793308deee2e08a6f177f74ecf24
          path: launcher-source
      - name: Build and test native launcher
        shell: powershell
        run: ./scripts/build-launcher.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: matrixgames-native-launcher
          path: dist/driving/MatrixGamesLauncher.exe
  native-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: compujuckel/AssettoServer
          ref: 6ce86addc1b1c70caf018a7b39f6d7bc9aa9493f
          path: assetto-build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Apply corresponding source and verify native server
        working-directory: assetto-build
        run: |
          git apply ../native/assetto/matrix-games.patch
          dotnet test AssettoServer.Tests/AssettoServer.Tests.csproj -c Release
          lua AssettoServer.Tests/matrix_physics_test.lua AssettoServer/Server/Lua/matrix_physics.lua
          lua AssettoServer.Tests/matrix_hud_test.lua
          dotnet publish AssettoServer/AssettoServer.csproj -c Release -r linux-x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: matrixgames-native-server
          path: assetto-build/publish/
  deploy:
    needs: [build, native-launcher, native-server]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: matrixcity-static
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: matrixgames-native-launcher
          path: dist/driving
      - name: Verify Azure deployment credential
        env:
          DEPLOY_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_STONE_0D3C53A0F }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::The Azure deployment secret is missing."
            exit 1
          fi
      - name: Get GitHub deployment identity
        id: identity
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Deploy production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_STONE_0D3C53A0F }}
          github_id_token: ${{ steps.identity.outputs.token }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
